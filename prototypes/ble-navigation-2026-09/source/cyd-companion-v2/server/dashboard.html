<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CYD · Диагностика</title>
<style>body{font:16px system-ui;margin:24px auto;padding:0 18px;max-width:1200px;background:#101820;color:#eef5f6}a{color:#74d7d0}h1{font-size:28px}section{background:#1a2935;padding:20px;border-radius:12px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace;line-height:1.5}select,input,button{padding:10px;background:#243d49;color:white;border:1px solid #5b7783;border-radius:6px}li{margin:10px 0}.muted{color:#b4c5cc}#error{color:#ffad91}</style>
<h1>CYD · мост и независимый диагност</h1><p><a href="/">Кнопки и сообщение</a> · <a href="/download/companion-v2.apk">APK моста</a> · <a href="/download/diagnostics-v2.apk">APK диагноста</a> · <a href="/download/navprobe.apk">APK Google Maps: данные уведомления</a> · <a href="/api/v2/events" download="companion-events.json">Полный JSON</a></p>
<p class="muted">Данные приходят из сохранённого журнала телефона. Отсутствие доставки не доказывает отсутствие события. Обновление раз в 5 секунд.</p><p id="error"></p><label>Телефон <select id="phone"></select></label> <label>Фильтр <input id="filter" placeholder="CDM, PI_SCAN, ERROR…"></label><main id="content"></main>
<script>
const phone=document.querySelector('#phone'),filter=document.querySelector('#filter'),content=document.querySelector('#content');let records=[],observers=[];
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
function render(){content.replaceChildren();const r=records.find(r=>r.installation===phone.value);if(!r){content.append(element('p','Отчётов от нового приложения ещё нет. Старое приложение сюда не пишет.'));return;}
 const remote=document.createElement('section');remote.append(element('h2','Связь с диагностом сейчас'));const observer=observers.find(o=>o.installation===r.installation);
 remote.append(element('p',observer?.receivedAt?`Последний ответ ${Math.floor(observer.ageMs/1000)} с назад · ${observer.contact==='recent'?'недавний ответ получен':'связь сейчас не подтверждена'}`:'Диагност ещё не подтвердил канал связи. Нужен диагност 2.0.2 и открытие его окна.'));
 if(observer?.heartbeat){remote.append(element('pre',`Диагност PID ${observer.heartbeat.pid} · ${observer.heartbeat.utc}\n${observer.heartbeat.system}`));}
 if(observer?.command)remote.append(element('pre',JSON.stringify(observer.command,null,2)));
 if(['localhost','127.0.0.1','[::1]'].includes(location.hostname)){const request=element('button','Запросить отчёт без запуска моста');request.onclick=async()=>{request.disabled=true;try{const response=await fetch('/api/v2/observer/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({installation:r.installation,type:'REPORT'})});if(!response.ok)throw Error(await response.text());await update();}catch(e){document.querySelector('#error').textContent=e.message;}finally{request.disabled=false;}};remote.append(request);}content.append(remote);
 const section=document.createElement('section');section.append(element('h2','Что подтверждено журналом'));section.append(element('p',`Последний приём сервером: ${r.receivedAt} · подтверждённый номер ${r.ack} · хранится ${r.events.length} событий`));const list=document.createElement('ul');for(const s of r.assessment)list.append(element('li',s));section.append(list);content.append(section);
 const q=filter.value.toLowerCase(),events=r.events.filter(e=>JSON.stringify(e).toLowerCase().includes(q)).slice(-250).reverse();const log=document.createElement('section');log.append(element('h2','Последние события (до 250)'));for(const e of events)log.append(element('pre',`#${e.seq} ${e.utc} · boot ${e.boot} · PID ${e.pid} · process ${e.session.slice(0,8)}\n${e.source} / ${e.type} · uptime ${e.elapsedMs} ms\n${e.detail}`));content.append(log);}
async function update(){try{const responses=await Promise.all([fetch('/api/v2/events'),fetch('/api/v2/observer/status')]);for(const response of responses)if(!response.ok)throw Error(`HTTP ${response.status}`);records=(await responses[0].json()).installations;observers=(await responses[1].json()).observers;const selected=phone.value;phone.replaceChildren();for(const r of records){const o=element('option',r.installation.slice(0,8));o.value=r.installation;phone.append(o);}if(records.some(r=>r.installation===selected))phone.value=selected;document.querySelector('#error').textContent='';render();}catch(e){document.querySelector('#error').textContent='Сервер недоступен: '+e.message;}}
phone.onchange=render;filter.oninput=render;update();setInterval(update,5000);
</script></html>
